<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>本机屏幕共享 · OpenRemote</title>
  <link rel="stylesheet" href="fluent.css">
  <link rel="stylesheet" href="sharing.css">
</head>
<body>
  <main aria-label="本机屏幕共享">
    <div class="heading">
      <span class="indicator" aria-hidden="true"></span>
      <div class="sharing-identity">
        <h1 id="status" role="status">正在确认共享状态…</h1>
        <p id="peer" aria-live="polite"></p>
      </div>
    </div>
    <div class="permission">
      <span id="access-mode" role="status"></span>
      <label><input id="view-only" type="checkbox" disabled>仅允许观看</label>
    </div>
    <p id="error" role="alert" hidden></p>
    <div class="actions">
      <button id="end" type="button" disabled>结束本次共享</button>
      <button id="pause" type="button" disabled>结束并暂停远程访问</button>
    </div>
  </main>
  <script src="sharing.js"></script>
</body>
</html>
